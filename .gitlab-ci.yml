stages:
  - lint
  - test
  - report
  - pages

default:
  image: mcr.microsoft.com/playwright:v1.42.0-jammy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

variables:
  DOMAIN: ecommerce
  ENV: qa
  CI: 'true'
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ─────────────────────────────────────────────────────────────
# Lint, format and typecheck (cheap and fast — fail early).
# ─────────────────────────────────────────────────────────────
lint:
  stage: lint
  script:
    - npm ci --prefer-offline --no-audit
    - npm run format:check
    - npm run lint
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Test matrix: one job per browser. Allure raw results are kept
# as artifacts so the `pages` stage can merge and publish them.
# ─────────────────────────────────────────────────────────────
.test-template: &test-template
  stage: test
  script:
    - npm ci --prefer-offline --no-audit
    - npx playwright test --project=$BROWSER
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - allure-results/
      - test-results/
    reports:
      junit: test-results/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:chromium:
  <<: *test-template
  variables:
    BROWSER: chromium

test:firefox:
  <<: *test-template
  variables:
    BROWSER: firefox

test:webkit:
  <<: *test-template
  variables:
    BROWSER: webkit

# ─────────────────────────────────────────────────────────────
# Generate a single Allure report from all browser jobs.
# ─────────────────────────────────────────────────────────────
allure:report:
  stage: report
  needs:
    - job: test:chromium
      artifacts: true
    - job: test:firefox
      artifacts: true
    - job: test:webkit
      artifacts: true
  script:
    - npm ci --prefer-offline --no-audit
    - npx allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - allure-report/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Publish the Allure report to GitLab Pages.
# After a successful pipeline on the default branch the report
# is reachable at https://<group>.gitlab.io/<project>/
# ─────────────────────────────────────────────────────────────
pages:
  stage: pages
  needs:
    - allure:report
  script:
    - mv allure-report public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
