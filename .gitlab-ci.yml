stages:
  - lint
  - test
  - report
  - pages

default:
  image: mcr.microsoft.com/playwright:v1.42.0-jammy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

variables:
  ENV: qa
  CI: 'true'
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ─────────────────────────────────────────────────────────────
# Lint, format and typecheck.
# ─────────────────────────────────────────────────────────────
lint:
  stage: lint
  script:
    - npm ci --prefer-offline --no-audit
    - npm run format:check
    - npm run lint
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.test-template: &test-template
  stage: test
  script:
    - npm ci --prefer-offline --no-audit
    - npx playwright test --project=$PROJECT
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - allure-results/
      - test-results/
    reports:
      junit: test-results/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:ecommerce:
  <<: *test-template
  variables:
    PROJECT: ecommerce

test:airline:
  <<: *test-template
  variables:
    PROJECT: airline

allure:report:
  stage: report
  needs:
    - job: test:ecommerce
      artifacts: true
    - job: test:airline
      artifacts: true
  script:
    - npm ci --prefer-offline --no-audit
    - npx allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - allure-report/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
